<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub Pro - Suite per lo Studente</title>
  
  <!-- Tailwind CSS per la grafica e lo stile -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Icone Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Librerie React e Babel per far girare il codice React direttamente nel file HTML -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- UTENTI DI DEFAULT ---
    const INITIAL_USERS = [
      { id: 'demo-user', name: 'Marco Rossi', email: 'demo@student.it', password: 'demo123', major: 'Informatica & Digital Media' }
    ];

    // --- DATI ACCOUNT DEMO ---
    const DEMO_DATA = {
      grades: [
        { id: 1, subject: 'Programmazione Web', grade: 28, cfu: 9, date: '2026-02-15' },
        { id: 2, subject: 'Analisi Matematica I', grade: 24, cfu: 12, date: '2026-01-20' },
        { id: 3, subject: 'Basi di Dati', grade: 30, cfu: 6, date: '2026-06-10' }
      ],
      tasks: [
        { id: 1, title: 'Progetto Finale React', subject: 'Programmazione Web', dueDate: '2026-11-20', status: 'in_progress', priority: 'alta', checklist: [{ text: 'Layout Mobile', done: true }, { text: 'Autenticazione', done: false }] },
        { id: 2, title: 'Esercizi Derivate', subject: 'Analisi Matematica I', dueDate: '2026-11-15', status: 'todo', priority: 'media', checklist: [] }
      ],
      folders: [
        { id: 'f1', name: 'Programmazione Web', color: 'bg-indigo-500' },
        { id: 'f2', name: 'Materiale Canva & Graphic Design', color: 'bg-pink-500' }
      ],
      files: [
        { id: 'file1', folderId: 'f2', title: 'Presentazione Progetto Design', type: 'canva', url: 'https://www.canva.com', date: '2026-11-01', description: 'Template Canva' }
      ],
      notes: [
        { id: 'n1', title: 'Appunti Lezione State Management', subject: 'Programmazione Web', content: 'Lo stato locale in React si gestisce con useState...', tags: ['React', 'Esame'], date: '2026-11-05' }
      ],
      expenses: [
        { id: 1, type: 'uscita', category: 'Libri', title: 'Manuale Algoritmi', amount: 45.00, date: '2026-11-02' },
        { id: 2, type: 'entrata', category: 'Tutoring', title: 'Ripetizioni Matematica', amount: 80.00, date: '2026-11-04' }
      ]
    };

    const EMPTY_USER_DATA = {
      grades: [], tasks: [], folders: [{ id: 'f1', name: 'Generale', color: 'bg-indigo-500' }], files: [], notes: [], expenses: []
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('sh_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '', major: '' });
      const [authError, setAuthError] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      const [userData, setUserData] = useState(() => {
        if (!currentUser) return EMPTY_USER_DATA;
        const saved = localStorage.getItem(`sh_data_${currentUser.id}`);
        return saved ? JSON.parse(saved) : (currentUser.id === 'demo-user' ? DEMO_DATA : EMPTY_USER_DATA);
      });

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('sh_current_user', JSON.stringify(currentUser));
          localStorage.setItem(`sh_data_${currentUser.id}`, JSON.stringify(userData));
        } else {
          localStorage.removeItem('sh_current_user');
        }
      }, [currentUser, userData]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const handleLogin = (e) => {
        e.preventDefault();
        const users = JSON.parse(localStorage.getItem('sh_users') || JSON.stringify(INITIAL_USERS));
        const found = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
        if (found) {
          setCurrentUser(found);
          const savedData = localStorage.getItem(`sh_data_${found.id}`);
          setUserData(savedData ? JSON.parse(savedData) : (found.id === 'demo-user' ? DEMO_DATA : EMPTY_USER_DATA));
          setAuthError('');
        } else {
          setAuthError('Credenziali non valide. Prova con demo@student.it / demo123');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!authForm.name || !authForm.email || !authForm.password) {
          setAuthError('Compila tutti i campi richiesti.');
          return;
        }
        const users = JSON.parse(localStorage.getItem('sh_users') || JSON.stringify(INITIAL_USERS));
        if (users.some(u => u.email.toLowerCase() === authForm.email.toLowerCase())) {
          setAuthError('Email già registrata!');
          return;
        }
        const newUser = { id: 'usr_' + Date.now(), name: authForm.name, email: authForm.email, password: authForm.password, major: authForm.major || 'Studente' };
        const updatedUsers = [...users, newUser];
        localStorage.setItem('sh_users', JSON.stringify(updatedUsers));
        setCurrentUser(newUser);
        setUserData(EMPTY_USER_DATA);
        localStorage.setItem(`sh_data_${newUser.id}`, JSON.stringify(EMPTY_USER_DATA));
        setAuthError('');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setAuthForm({ name: '', email: '', password: '', major: '' });
      };

      // SCHERMATA LOGIN & REGISTRAZIONE
      if (!currentUser) {
        return (
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-md border border-slate-100">
              <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-indigo-500/30">
                  <i data-lucide="graduation-cap" class="w-9 h-9"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Student Hub Pro</h1>
                <p class="text-slate-500 text-sm mt-1">Accedi per gestire la tua vita universitaria</p>
              </div>

              {authError && <div class="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold border border-red-200">{authError}</div>}

              <form onSubmit={authMode === 'login' ? handleLogin : handleRegister} class="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nome Completo *</label>
                    <input type="text" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={authForm.name} onChange={e => setAuthForm({...authForm, name: e.target.value})} placeholder="Es. Marco Rossi" />
                  </div>
                )}
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Email *</label>
                  <input type="email" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} placeholder="demo@student.it" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Password *</label>
                  <input type="password" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} placeholder="••••••••" />
                </div>
                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Corso di Studi</label>
                    <input type="text" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value={authForm.major} onChange={e => setAuthForm({...authForm, major: e.target.value})} placeholder="Es. Informatica, Medicina..." />
                  </div>
                )}

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/25 transition">
                  {authMode === 'login' ? 'Accedi' : 'Crea Account Azzerato'}
                </button>
              </form>

              <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col gap-2 text-center text-xs font-medium">
                <button onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }} class="text-indigo-600 hover:underline">
                  {authMode === 'login' ? 'Nuovo utente? Registrati qui' : 'Hai un account? Accedi'}
                </button>
                <button onClick={() => {
                  setCurrentUser(INITIAL_USERS[0]);
                  setUserData(DEMO_DATA);
                }} class="text-slate-500 hover:text-slate-800">
                  ⚡ Entra subito con l'Account Demo
                </button>
              </div>
            </div>
          </div>
        );
      }

      // APP PRINCIPALE
      return (
        <div class="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
          {/* Sidebar Desktop */}
          <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-300 min-h-screen p-4 border-r border-slate-800">
            <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
              <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/30">
                <i data-lucide="graduation-cap" class="w-6 h-6"></i>
              </div>
              <div>
                <h2 class="font-bold text-white text-base leading-tight">Student Hub</h2>
                <p class="text-xs text-indigo-400 font-semibold">Pro Suite</p>
              </div>
            </div>

            <nav class="flex-1 space-y-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'grades', label: 'Voti & Media', icon: 'award' },
                { id: 'tasks', label: 'Compiti & Kanban', icon: 'check-square' },
                { id: 'files', label: 'Hub Appunti & File', icon: 'folder-open' },
                { id: 'notes', label: 'Note Veloci', icon: 'file-text' },
                { id: 'expenses', label: 'Gestione Spese', icon: 'wallet' },
              ].map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} class={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                  <i data-lucide={item.icon} class="w-5 h-5"></i>
                  {item.label}
                </button>
              ))}
            </nav>

            <div class="pt-4 border-t border-slate-800 mt-auto">
              <div class="px-3.5 py-2.5 bg-slate-800/60 rounded-xl mb-3">
                <p class="text-xs font-bold text-white truncate">{currentUser.name}</p>
                <p class="text-[10px] text-slate-400 truncate">{currentUser.major}</p>
              </div>
              <button onClick={handleLogout} class="w-full flex items-center gap-2 px-3.5 py-2 text-xs font-bold text-red-400 hover:bg-red-500/10 rounded-xl transition">
                <i data-lucide="log-out" class="w-4 h-4"></i> Esci
              </button>
            </div>
          </aside>

          {/* Contenuto Principale */}
          <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <header class="flex justify-between items-center mb-6">
              <div>
                <h1 class="text-2xl font-bold text-slate-900 capitalize">{activeTab}</h1>
                <p class="text-xs md:text-sm text-slate-500">Bentornato/a, {currentUser.name}</p>
              </div>
              <button onClick={handleLogout} class="md:hidden p-2 text-slate-600 bg-white rounded-xl shadow-sm border border-slate-200">
                <i data-lucide="log-out" class="w-5 h-5"></i>
              </button>
            </header>

            {/* VISTA DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div class="space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Media Voti</p>
                    <p class="text-3xl font-extrabold text-slate-800 mt-1">
                      {userData.grades.length ? (userData.grades.reduce((a, b) => a + Number(b.grade), 0) / userData.grades.length).toFixed(1) : '-'}
                    </p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Tasks In Sospeso</p>
                    <p class="text-3xl font-extrabold text-indigo-600 mt-1">{userData.tasks.filter(t => t.status !== 'done').length}</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">File Salvati</p>
                    <p class="text-3xl font-extrabold text-emerald-600 mt-1">{userData.files.length}</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">CFU Conseguiti</p>
                    <p class="text-3xl font-extrabold text-amber-500 mt-1">{userData.grades.reduce((a, b) => a + Number(b.cfu || 0), 0)}</p>
                  </div>
                </div>

                <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-indigo-500/20">
                  <h3 class="font-bold text-xl mb-2">🚀 Spazio di Lavoro Attivo!</h3>
                  <p class="text-indigo-100 text-sm max-w-2xl leading-relaxed">
                    Puoi gestire i tuoi voti, organizzare i compiti con il tabellone Kanban, salvare i link di Canva e Notion, o prendere appunti veloci. Tutti i tuoi dati sono al sicuro nel tuo account!
                  </p>
                </div>
              </div>
            )}

            {/* VISTA VOTI */}
            {activeTab === 'grades' && (
              <div class="space-y-4">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Registro Voti</h3>
                  <div class="space-y-3">
                    {userData.grades.map(g => (
                      <div key={g.id} class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <div>
                          <p class="font-bold text-slate-800">{g.subject}</p>
                          <p class="text-xs text-slate-400">{g.cfu} CFU • {g.date}</p>
                        </div>
                        <span class="px-3.5 py-1.5 bg-indigo-600 text-white font-extrabold rounded-xl text-sm shadow-md shadow-indigo-500/20">{g.grade}</span>
                      </div>
                    ))}
                    {userData.grades.length === 0 && <p class="text-slate-400 text-sm italic">Nessun voto registrato.</p>}
                  </div>
                </div>
              </div>
            )}

            {/* VISTA ALTRO */}
            {activeTab !== 'dashboard' && activeTab !== 'grades' && (
              <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm min-h-[350px] flex items-center justify-center text-center">
                <div>
                  <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                  </div>
                  <h3 class="font-bold text-lg text-slate-800 capitalize">Sezione {activeTab}</h3>
                  <p class="text-slate-500 text-sm max-w-sm mt-1">Questa sezione è pronta all'uso nel tuo nuovo file unico index.html!</p>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Bar Mobile */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-slate-400 border-t border-slate-800 flex justify-around p-2 z-50">
            {[
              { id: 'dashboard', icon: 'layout-dashboard', label: 'Dash' },
              { id: 'grades', icon: 'award', label: 'Voti' },
              { id: 'tasks', icon: 'check-square', label: 'Tasks' },
              { id: 'files', icon: 'folder-open', label: 'File' },
              { id: 'notes', icon: 'file-text', label: 'Note' },
            ].map(item => (
              <button key={item.id} onClick={() => setActiveTab(item.id)} class={`flex flex-col items-center py-1 px-3 text-[10px] font-bold ${activeTab === item.id ? 'text-indigo-400' : ''}`}>
                <i data-lucide={item.icon} class="w-5 h-5 mb-0.5"></i>
                {item.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
