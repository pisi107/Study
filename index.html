<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub Pro - Suite Globale per lo Studente</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_USERS = [
      { id: 'demo-user', name: 'Marco Rossi', email: 'demo@student.it', password: 'demo123', major: 'Informatica & Digital Media' }
    ];

    const INITIAL_DEMO_DATA = {
      grades: [
        { id: 1, subject: 'Programmazione Web', grade: 28, cfu: 9, date: '2026-02-15' },
        { id: 2, subject: 'Analisi Matematica I', grade: 24, cfu: 12, date: '2026-01-20' },
        { id: 3, subject: 'Basi di Dati', grade: 30, cfu: 6, date: '2026-06-10' }
      ],
      tasks: [
        { id: 1, title: 'Progetto Finale React', subject: 'Programmazione Web', dueDate: '2026-11-20', status: 'in_progress', priority: 'alta', checklist: [{ id: 'c1', text: 'Layout Mobile', done: true }, { id: 'c2', text: 'Autenticazione', done: false }] },
        { id: 2, title: 'Esercizi Derivate', subject: 'Analisi Matematica I', dueDate: '2026-11-15', status: 'todo', priority: 'media', checklist: [] }
      ],
      folders: [
        { id: 'f1', name: 'Programmazione Web', color: 'bg-indigo-500' },
        { id: 'f2', name: 'Materiale Canva & Graphic Design', color: 'bg-pink-500' }
      ],
      files: [
        { id: 'file1', folderId: 'f2', title: 'Presentazione Progetto Design', type: 'canva', url: 'https://www.canva.com', date: '2026-11-01', description: 'Template Canva per la discussione' }
      ],
      notes: [
        { id: 'n1', title: 'Appunti State Management', subject: 'Programmazione Web', content: 'Lo stato locale in React si gestisce con useState...', tags: ['React', 'Esame'], date: '2026-11-05' }
      ],
      expenses: [
        { id: 1, type: 'uscita', category: 'Libri', title: 'Manuale Algoritmi', amount: 45.00, date: '2026-11-02' },
        { id: 2, type: 'entrata', category: 'Tutoring', title: 'Ripetizioni Matematica', amount: 80.00, date: '2026-11-04' }
      ],
      professors: [
        { id: 1, name: 'Prof. Mario Bianchi', subject: 'Programmazione Web', email: 'mario.bianchi@unifi.it', office: 'Stanza 304, Edificio F', officeHours: 'Martedì 14:00 - 16:00' }
      ],
      schedule: [
        { id: 1, day: 'Lunedì', subject: 'Programmazione Web', time: '09:00 - 11:00', room: 'Aula 3' },
        { id: 2, day: 'Mercoledì', subject: 'Analisi Matematica I', time: '11:00 - 13:00', room: 'Aula Magna' }
      ]
    };

    const EMPTY_USER_DATA = {
      grades: [], tasks: [], folders: [{ id: 'f1', name: 'Generale', color: 'bg-indigo-500' }], files: [], notes: [], expenses: [], professors: [], schedule: []
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('sh_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '', major: '' });
      const [authError, setAuthError] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');

      const [userData, setUserData] = useState(() => {
        if (!currentUser) return EMPTY_USER_DATA;
        const saved = localStorage.getItem(`sh_data_${currentUser.id}`);
        return saved ? JSON.parse(saved) : (currentUser.id === 'demo-user' ? INITIAL_DEMO_DATA : EMPTY_USER_DATA);
      });

      // Form local states
      const [newGrade, setNewGrade] = useState({ subject: '', grade: '', cfu: '', date: '' });
      const [targetGraduation, setTargetGraduation] = useState(105);
      const [remainingCfu, setRemainingCfu] = useState(30);

      const [newTask, setNewTask] = useState({ title: '', subject: '', dueDate: '', priority: 'media' });
      const [newFolder, setNewFolder] = useState({ name: '', color: 'bg-indigo-500' });
      const [newFile, setNewFile] = useState({ folderId: 'f1', title: '', type: 'link', url: '', description: '' });
      const [newNote, setNewNote] = useState({ title: '', subject: '', content: '', tags: '' });
      const [newExpense, setNewExpense] = useState({ type: 'uscita', category: 'Libri', title: '', amount: '', date: '' });
      const [newProf, setNewProf] = useState({ name: '', subject: '', email: '', office: '', officeHours: '' });
      const [newSchedule, setNewSchedule] = useState({ day: 'Lunedì', subject: '', time: '', room: '' });

      // Pomodoro Timer State
      const [pomoTime, setPomoTime] = useState(25 * 60);
      const [pomoActive, setPomoActive] = useState(false);
      const [pomoMode, setPomoMode] = useState('work'); // 'work' or 'break'
      const audioCtxRef = useRef(null);

      useEffect(() => {
        let interval = null;
        if (pomoActive && pomoTime > 0) {
          interval = setInterval(() => setPomoTime(t => t - 1), 1000);
        } else if (pomoTime === 0) {
          if (pomoMode === 'work') { setPomoMode('break'); setPomoTime(5 * 60); }
          else { setPomoMode('work'); setPomoTime(25 * 60); }
          setPomoActive(false);
        }
        return () => clearInterval(interval);
      }, [pomoActive, pomoTime, pomoMode]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('sh_current_user', JSON.stringify(currentUser));
          localStorage.setItem(`sh_data_${currentUser.id}`, JSON.stringify(userData));
        } else {
          localStorage.removeItem('sh_current_user');
        }
      }, [currentUser, userData]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Auth Functions
      const handleLogin = (e) => {
        e.preventDefault();
        const users = JSON.parse(localStorage.getItem('sh_users') || JSON.stringify(INITIAL_USERS));
        const found = users.find(u => u.email.toLowerCase() === authForm.email.toLowerCase() && u.password === authForm.password);
        if (found) {
          setCurrentUser(found);
          const savedData = localStorage.getItem(`sh_data_${found.id}`);
          setUserData(savedData ? JSON.parse(savedData) : (found.id === 'demo-user' ? INITIAL_DEMO_DATA : EMPTY_USER_DATA));
          setAuthError('');
        } else {
          setAuthError('Credenziali non valide. Prova demo@student.it / demo123');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!authForm.name || !authForm.email || !authForm.password) {
          setAuthError('Compila tutti i campi obbligatori.');
          return;
        }
        const users = JSON.parse(localStorage.getItem('sh_users') || JSON.stringify(INITIAL_USERS));
        if (users.some(u => u.email.toLowerCase() === authForm.email.toLowerCase())) {
          setAuthError('Email già registrata!');
          return;
        }
        const newUser = { id: 'usr_' + Date.now(), name: authForm.name, email: authForm.email, password: authForm.password, major: authForm.major || 'Studente' };
        localStorage.setItem('sh_users', JSON.stringify([...users, newUser]));
        setCurrentUser(newUser);
        setUserData(EMPTY_USER_DATA);
        localStorage.setItem(`sh_data_${newUser.id}`, JSON.stringify(EMPTY_USER_DATA));
        setAuthError('');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setAuthForm({ name: '', email: '', password: '', major: '' });
      };

      const exportBackup = () => {
        const blob = new Blob([JSON.stringify({ user: currentUser, data: userData }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `StudentHub_Backup_${currentUser.name.replace(/\s+/g, '_')}.json`;
        a.click();
      };

      // Sound synth for Pomodoro
      const playAmbientSound = (type) => {
        try {
          if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'rain') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
          } else if (type === 'white') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            gain.gain.setValueAtTime(0.03, ctx.currentTime);
          }
          osc.start();
          osc.stop(ctx.currentTime + 1.5);
        } catch(e) {}
      };

      // Calculated stats
      const totalCfu = userData.grades.reduce((a, b) => a + Number(b.cfu || 0), 0);
      const avgGrade = userData.grades.length ? (userData.grades.reduce((a, b) => a + Number(b.grade), 0) / userData.grades.length).toFixed(2) : 0;
      const graduationBase = (avgGrade * 110) / 30;
      const requiredGrade = remainingCfu > 0 ? (((targetGraduation * (totalCfu + Number(remainingCfu)) / 110) - (avgGrade * totalCfu)) / remainingCfu).toFixed(2) : 0;

      // LOGIN / REGISTRATION SCREEN
      if (!currentUser) {
        return (
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-md border border-slate-100">
              <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-indigo-500/30">
                  <i data-lucide="graduation-cap" class="w-9 h-9"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Student Hub Pro</h1>
                <p class="text-slate-500 text-sm mt-1">La tua suite universitaria completa</p>
              </div>

              {authError && <div class="mb-4 p-3 bg-red-50 text-red-600 rounded-xl text-xs font-semibold border border-red-200">{authError}</div>}

              <form onSubmit={authMode === 'login' ? handleLogin : handleRegister} class="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nome Completo *</label>
                    <input type="text" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500" value={authForm.name} onChange={e => setAuthForm({...authForm, name: e.target.value})} placeholder="Es. Mario Rossi" />
                  </div>
                )}
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Email *</label>
                  <input type="email" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500" value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} placeholder="demo@student.it" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Password *</label>
                  <input type="password" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500" value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} placeholder="••••••••" />
                </div>
                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Corso di Studi</label>
                    <input type="text" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500" value={authForm.major} onChange={e => setAuthForm({...authForm, major: e.target.value})} placeholder="Es. Ingegneria, Economia..." />
                  </div>
                )}
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-500/25 transition">
                  {authMode === 'login' ? 'Accedi' : 'Crea Nuovo Account Pulito'}
                </button>
              </form>

              <div class="mt-6 pt-4 border-t border-slate-100 flex flex-col gap-2 text-center text-xs font-medium">
                <button onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }} class="text-indigo-600 hover:underline">
                  {authMode === 'login' ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi'}
                </button>
                <button onClick={() => { setCurrentUser(INITIAL_USERS[0]); setUserData(INITIAL_DEMO_DATA); }} class="text-slate-500 hover:text-slate-800">
                  ⚡ Entra subito come Demo
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
          {/* Sidebar Desktop */}
          <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-300 min-h-screen p-4 border-r border-slate-800">
            <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800">
              <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/30">
                <i data-lucide="graduation-cap" class="w-6 h-6"></i>
              </div>
              <div>
                <h2 class="font-bold text-white text-base leading-tight">Student Hub</h2>
                <p class="text-xs text-indigo-400 font-semibold">Pro Suite</p>
              </div>
            </div>

            <nav class="flex-1 space-y-1 overflow-y-auto custom-scrollbar">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'grades', label: 'Voti & Simulatore', icon: 'award' },
                { id: 'tasks', label: 'Compiti & Kanban', icon: 'check-square' },
                { id: 'pomodoro', label: 'Timer Pomodoro', icon: 'clock' },
                { id: 'files', label: 'Hub Cartelle & Canva', icon: 'folder-open' },
                { id: 'notes', label: 'Note & Appunti', icon: 'file-text' },
                { id: 'expenses', label: 'Spese Studente', icon: 'wallet' },
                { id: 'professors', label: 'Docenti & Orario', icon: 'users' },
              ].map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} class={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                  <i data-lucide={item.icon} class="w-5 h-5"></i>
                  {item.label}
                </button>
              ))}
            </nav>

            <div class="pt-4 border-t border-slate-800 mt-auto space-y-2">
              <button onClick={exportBackup} class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition">
                <i data-lucide="download" class="w-4 h-4"></i> Esporta Backup JSON
              </button>
              <div class="px-3.5 py-2.5 bg-slate-800/60 rounded-xl">
                <p class="text-xs font-bold text-white truncate">{currentUser.name}</p>
                <p class="text-[10px] text-slate-400 truncate">{currentUser.major}</p>
              </div>
              <button onClick={handleLogout} class="w-full flex items-center gap-2 px-3.5 py-2 text-xs font-bold text-red-400 hover:bg-red-500/10 rounded-xl transition">
                <i data-lucide="log-out" class="w-4 h-4"></i> Esci dall'Account
              </button>
            </div>
          </aside>

          {/* Main Area */}
          <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <header class="flex justify-between items-center mb-6">
              <div>
                <h1 class="text-2xl font-bold text-slate-900 capitalize">{activeTab}</h1>
                <p class="text-xs md:text-sm text-slate-500">Studente: {currentUser.name}</p>
              </div>
              <div class="flex items-center gap-2">
                <button onClick={exportBackup} class="md:hidden p-2 text-slate-600 bg-white rounded-xl shadow-sm border border-slate-200" title="Esporta Backup">
                  <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <button onClick={handleLogout} class="md:hidden p-2 text-slate-600 bg-white rounded-xl shadow-sm border border-slate-200">
                  <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
              </div>
            </header>

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div class="space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Media Voti</p>
                    <p class="text-3xl font-extrabold text-slate-800 mt-1">{avgGrade || '-'}</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Tasks In Sospeso</p>
                    <p class="text-3xl font-extrabold text-indigo-600 mt-1">{userData.tasks.filter(t => t.status !== 'done').length}</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">File & Risorse</p>
                    <p class="text-3xl font-extrabold text-emerald-600 mt-1">{userData.files.length}</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">CFU Conseguiti</p>
                    <p class="text-3xl font-extrabold text-amber-500 mt-1">{totalCfu}</p>
                  </div>
                </div>

                <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white rounded-3xl p-6 md:p-8 shadow-xl shadow-indigo-500/20">
                  <h3 class="font-bold text-xl mb-2">🚀 Spazio di Lavoro Attivo!</h3>
                  <p class="text-indigo-100 text-sm max-w-2xl leading-relaxed">
                    Benvenuto nella tua suite globale. Naviga tra le sezioni per inserire esami, organizzare compiti e gestire file.
                  </p>
                </div>
              </div>
            )}

            {/* VOTI & SIMULATORE */}
            {activeTab === 'grades' && (
              <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                    <p class="text-xs font-bold text-indigo-600 uppercase">Voto Partenza Laurea</p>
                    <p class="text-3xl font-extrabold text-indigo-900 mt-1">{graduationBase ? graduationBase.toFixed(1) : 0} / 110</p>
                  </div>
                  <div class="bg-white p-5 rounded-2xl border border-slate-200">
                    <label class="text-xs font-bold text-slate-500 uppercase block mb-1">Obiettivo Voto Finale</label>
                    <input type="number" value={targetGraduation} onChange={e => setTargetGraduation(e.target.value)} class="w-full text-xl font-bold bg-slate-50 border rounded-xl p-2" />
                  </div>
                  <div class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
                    <p class="text-xs font-bold text-emerald-600 uppercase">Media Necessaria nei prossimi CFU</p>
                    <p class="text-3xl font-extrabold text-emerald-900 mt-1">{requiredGrade > 0 ? requiredGrade : 'N/D'}</p>
                  </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Aggiungi Nuovo Esame</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newGrade.subject || !newGrade.grade) return;
                    setUserData({...userData, grades: [...userData.grades, { id: Date.now(), ...newGrade }]});
                    setNewGrade({ subject: '', grade: '', cfu: '', date: '' });
                  }} class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input type="text" placeholder="Materia *" class="px-3 py-2 border rounded-xl text-sm" value={newGrade.subject} onChange={e => setNewGrade({...newGrade, subject: e.target.value})} required />
                    <input type="number" placeholder="Voto (es. 28) *" class="px-3 py-2 border rounded-xl text-sm" value={newGrade.grade} onChange={e => setNewGrade({...newGrade, grade: e.target.value})} required />
                    <input type="number" placeholder="CFU (es. 9)" class="px-3 py-2 border rounded-xl text-sm" value={newGrade.cfu} onChange={e => setNewGrade({...newGrade, cfu: e.target.value})} />
                    <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl text-sm py-2 shadow-md">Registra Voto</button>
                  </form>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Libretto Esami</h3>
                  <div class="space-y-3">
                    {userData.grades.map(g => (
                      <div key={g.id} class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <div>
                          <p class="font-bold text-slate-800">{g.subject}</p>
                          <p class="text-xs text-slate-400">{g.cfu || 6} CFU</p>
                        </div>
                        <span class="px-3.5 py-1.5 bg-indigo-600 text-white font-extrabold rounded-xl text-sm">{g.grade}</span>
                      </div>
                    ))}
                    {userData.grades.length === 0 && <p class="text-slate-400 text-sm italic">Nessun voto registrato.</p>}
                  </div>
                </div>
              </div>
            )}

            {/* COMPITI KANBAN */}
            {activeTab === 'tasks' && (
              <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Nuova Attività / Progetto</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newTask.title) return;
                    setUserData({...userData, tasks: [...userData.tasks, { id: Date.now(), ...newTask, status: 'todo', checklist: [] }]});
                    setNewTask({ title: '', subject: '', dueDate: '', priority: 'media' });
                  }} class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input type="text" placeholder="Titolo attività *" class="px-3 py-2 border rounded-xl text-sm" value={newTask.title} onChange={e => setNewTask({...newTask, title: e.target.value})} required />
                    <input type="text" placeholder="Materia" class="px-3 py-2 border rounded-xl text-sm" value={newTask.subject} onChange={e => setNewTask({...newTask, subject: e.target.value})} />
                    <input type="date" class="px-3 py-2 border rounded-xl text-sm" value={newTask.dueDate} onChange={e => setNewTask({...newTask, dueDate: e.target.value})} />
                    <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl text-sm py-2 shadow-md">Aggiungi Task</button>
                  </form>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {['todo', 'in_progress', 'done'].map(status => (
                    <div key={status} class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <h4 class="font-bold text-sm text-slate-700 uppercase mb-3">{status === 'todo' ? '📌 Da Fare' : status === 'in_progress' ? '⚡ In Corso' : '✅ Completati'}</h4>
                      <div class="space-y-3">
                        {userData.tasks.filter(t => t.status === status).map(t => (
                          <div key={t.id} class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 flex flex-col gap-2">
                            <p class="font-bold text-slate-800 text-sm">{t.title}</p>
                            <p class="text-xs text-slate-400">{t.subject || 'Generale'}</p>
                            <div class="flex gap-2 mt-2">
                              {status !== 'todo' && <button onClick={() => {
                                const updated = userData.tasks.map(item => item.id === t.id ? {...item, status: status === 'done' ? 'in_progress' : 'todo'} : item);
                                setUserData({...userData, tasks: updated});
                              }} class="text-[10px] bg-slate-200 px-2 py-1 rounded font-bold">← Sposta</button>}
                              {status !== 'done' && <button onClick={() => {
                                const updated = userData.tasks.map(item => item.id === t.id ? {...item, status: status === 'todo' ? 'in_progress' : 'done'} : item);
                                setUserData({...userData, tasks: updated});
                              }} class="text-[10px] bg-indigo-600 text-white px-2 py-1 rounded font-bold">Sposta →</button>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TIMER POMODORO */}
            {activeTab === 'pomodoro' && (
              <div class="max-w-md mx-auto bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-center space-y-6">
                <span class="px-3 py-1 bg-indigo-100 text-indigo-700 font-bold rounded-full text-xs uppercase">{pomoMode === 'work' ? '🎯 Sessione Studio' : '☕ Pausa'}</span>
                <div class="text-6xl font-black text-slate-800 tracking-tight">
                  {Math.floor(pomoTime / 60).toString().padStart(2, '0')}:{(pomoTime % 60).toString().padStart(2, '0')}
                </div>
                <div class="flex justify-center gap-3">
                  <button onClick={() => setPomoActive(!pomoActive)} class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25">
                    {pomoActive ? 'Pausa' : 'Avvia'}
                  </button>
                  <button onClick={() => { setPomoActive(false); setPomoTime(25*60); setPomoMode('work'); }} class="px-4 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl">
                    Reset
                  </button>
                </div>
                <div class="pt-4 border-t border-slate-100">
                  <p class="text-xs font-bold text-slate-400 uppercase mb-3">Suoni Ambientali Synth</p>
                  <div class="flex justify-center gap-2">
                    <button onClick={() => playAmbientSound('rain')} class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg">🌧️ Pioggia</button>
                    <button onClick={() => playAmbientSound('white')} class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg">🌊 Onde</button>
                  </div>
                </div>
              </div>
            )}

            {/* HUB CARTELLE & CANVA */}
            {activeTab === 'files' && (
              <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Aggiungi Cartella</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newFolder.name) return;
                    setUserData({...userData, folders: [...userData.folders, { id: 'f_' + Date.now(), ...newFolder }]});
                    setNewFolder({ name: '', color: 'bg-indigo-500' });
                  }} class="flex gap-3">
                    <input type="text" placeholder="Nome cartella *" class="flex-1 px-3 py-2 border rounded-xl text-sm" value={newFolder.name} onChange={e => setNewFolder({...newFolder, name: e.target.value})} required />
                    <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl text-sm px-4 py-2 shadow-md">Crea Cartella</button>
                  </form>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {userData.folders.map(f => (
                    <div key={f.id} class="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center gap-3">
                      <div class={`w-10 h-10 ${f.color} rounded-xl flex items-center justify-center text-white font-bold`}>
                        <i data-lucide="folder" class="w-5 h-5"></i>
                      </div>
                      <div>
                        <h4 class="font-bold text-slate-800">{f.name}</h4>
                        <p class="text-xs text-slate-400">{userData.files.filter(fi => fi.folderId === f.id).length} file collegati</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* NOTE */}
            {activeTab === 'notes' && (
              <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Scrivi Nuova Nota</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newNote.title) return;
                    setUserData({...userData, notes: [...userData.notes, { id: 'n_' + Date.now(), ...newNote, date: new Date().toISOString().split('T')[0] }]});
                    setNewNote({ title: '', subject: '', content: '', tags: '' });
                  }} class="space-y-3">
                    <input type="text" placeholder="Titolo nota *" class="w-full px-3 py-2 border rounded-xl text-sm" value={newNote.title} onChange={e => setNewNote({...newNote, title: e.target.value})} required />
                    <textarea placeholder="Contenuto appunti..." class="w-full px-3 py-2 border rounded-xl text-sm h-24" value={newNote.content} onChange={e => setNewNote({...newNote, content: e.target.value})}></textarea>
                    <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl text-sm px-4 py-2 shadow-md">Salva Nota</button>
                  </form>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {userData.notes.map(n => (
                    <div key={n.id} class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                      <h4 class="font-bold text-slate-800">{n.title}</h4>
                      <p class="text-xs text-indigo-600 font-semibold mt-0.5">{n.subject || 'Generale'}</p>
                      <p class="text-sm text-slate-600 mt-2 whitespace-pre-wrap">{n.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SPESE */}
            {activeTab === 'expenses' && (
              <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Registra Spesa / Entrata</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if(!newExpense.title || !newExpense.amount) return;
                    setUserData({...userData, expenses: [...userData.expenses, { id: Date.now(), ...newExpense, amount: Number(newExpense.amount) }]});
                    setNewExpense({ type: 'uscita', category: 'Libri', title: '', amount: '', date: '' });
                  }} class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input type="text" placeholder="Descrizione *" class="px-3 py-2 border rounded-xl text-sm" value={newExpense.title} onChange={e => setNewExpense({...newExpense, title: e.target.value})} required />
                    <input type="number" step="0.01" placeholder="Importo € *" class="px-3 py-2 border rounded-xl text-sm" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} required />
                    <select class="px-3 py-2 border rounded-xl text-sm bg-white" value={newExpense.type} onChange={e => setNewExpense({...newExpense, type: e.target.value})}>
                      <option value="uscita">Uscita (-)</option>
                      <option value="entrata">Entrata (+)</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 text-white font-bold rounded-xl text-sm py-2 shadow-md">Registra Transazione</button>
                  </form>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Storico Movimenti</h3>
                  <div class="space-y-3">
                    {userData.expenses.map(ex => (
                      <div key={ex.id} class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                        <div>
                          <p class="font-bold text-slate-800">{ex.title}</p>
                          <p class="text-xs text-slate-400">{ex.category}</p>
                        </div>
                        <span class={`font-extrabold text-sm ${ex.type === 'entrata' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {ex.type === 'entrata' ? '+' : '-'}€{Number(ex.amount).toFixed(2)}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* DOCENTI & ORARIO */}
            {activeTab === 'professors' && (
              <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                  <h3 class="font-bold text-lg mb-4 text-slate-800">Rubrica Docenti</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {userData.professors.map(p => (
                      <div key={p.id} class="p-4 bg-slate-50 rounded-2xl border border-slate-100 space-y-1">
                        <h4 class="font-bold text-slate-800">{p.name}</h4>
                        <p class="text-xs text-indigo-600 font-semibold">{p.subject}</p>
                        <p class="text-xs text-slate-500">📧 {p.email}</p>
                        <p class="text-xs text-slate-500">🏢 {p.office}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Bar Mobile */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-slate-400 border-t border-slate-800 flex justify-around p-2 z-50">
            {[
              { id: 'dashboard', icon: 'layout-dashboard', label: 'Dash' },
              { id: 'grades', icon: 'award', label: 'Voti' },
              { id: 'tasks', icon: 'check-square', label: 'Tasks' },
              { id: 'pomodoro', icon: 'clock', label: 'Focus' },
              { id: 'files', icon: 'folder-open', label: 'File' },
              { id: 'notes', icon: 'file-text', label: 'Note' },
            ].map(item => (
              <button key={item.id} onClick={() => setActiveTab(item.id)} class={`flex flex-col items-center py-1 px-2 text-[10px] font-bold ${activeTab === item.id ? 'text-indigo-400' : ''}`}>
                <i data-lucide={item.icon} class="w-5 h-5 mb-0.5"></i>
                {item.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
